name: Consumer pin freshness

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freshness:
    name: Verify approved consumer pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # This job only reads GitHub evidence. It does not install dependencies,
      # download candidate code, dispatch a candidate, or run package scripts.
      - name: Reject unapproved, stale or unqualified consumer pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/consumer-policy.ts .github/consumer-policy.json .github/consumer-pin.json
