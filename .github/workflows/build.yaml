# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions: {}

env:
  CI_LINT: ${{ github.event_name == 'pull_request' }}
  CI_TEST: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
  CI_PUBLISH_RELEASE: ${{ github.repository == 'radius-project/dashboard' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
  CI_PUBLISH_LATEST: ${{ github.repository == 'radius-project/dashboard' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # GU-25 compares the committed graph records against the base branch
          # to catch baseline edits that are not declared in the expected-change
          # manifest, so the base commit has to be present in the clone.
          fetch-depth: 0

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        if: ${{ env.CI_LINT == 'true' }}
        run: yarn run lint:all

      - name: Format
        if: ${{ env.CI_LINT == 'true' }}
        run: yarn run format:check

      - name: Build TypeScript
        run: yarn run tsc

      - name: Build
        run: yarn workspaces foreach -A run build:all

      - name: Build Storybook
        run: yarn workspace @radapp.io/rad-components run build-storybook

      - name: Run Tests
        if: ${{ env.CI_TEST == 'true' }}
        env:
          # Empty on push builds, where GU-25 falls back to origin/main.
          GRAPH_RECORD_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: yarn run test:all

      - name: Install Playwright browser
        if: ${{ env.CI_TEST == 'true' }}
        run: yarn exec playwright install --with-deps chromium

      - name: Qualify Built Standalone Host
        if: ${{ env.CI_TEST == 'true' }}
        env:
          NODE_ENV: production
        run: yarn run test:e2e:standalone

      - name: Run Component Browser Tests
        if: ${{ env.CI_TEST == 'true' }}
        run: yarn run test:e2e:components

      - name: Qualify Package Artifacts
        if: ${{ env.CI_TEST == 'true' }}
        run: yarn run test:package

  build-and-publish-container:
    name: Build and Publish Container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: dashboard-container-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref || github.run_id }}
      cancel-in-progress: false
    env:
      BUILT_IMAGE: ghcr.io/radius-project/dashboard:latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build TypeScript
        run: yarn run tsc

      - name: Build Backend
        run: yarn run build:backend

      - name: Login to ghcr.io
        if: ${{ env.CI_PUBLISH_LATEST == 'true' || env.CI_PUBLISH_RELEASE == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: yarn run build-image

      - name: Install Playwright browser
        run: yarn exec playwright install chromium

      - name: Start built container
        run: docker run -d --rm --name dashboard-e2e -p 7007:7007 "${BUILT_IMAGE}"

      - name: Wait for container to become ready
        run: |
          # Wait up to 60 seconds for the app to start (30 attempts x 2 seconds).
          for _ in {1..30}; do
            if curl -fsS http://localhost:7007 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs dashboard-e2e
          exit 1

      - name: Run E2E Tests Against Built Container
        run: PLAYWRIGHT_URL=http://localhost:7007 PLAYWRIGHT_DISABLE_WEBSERVER=true yarn run test:e2e

      - name: Stop test container
        if: ${{ always() }}
        run: docker stop dashboard-e2e || true

      # FS-16: qualify the built candidate, then restore the previous qualified image.
      - name: Qualify image rollback
        continue-on-error: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          PREVIOUS_IMAGE: ghcr.io/radius-project/dashboard@sha256:166dcc84f8399b6c7b2e060c22eda390763d9379001e24695a961154679daa44
          PREVIOUS_REVISION: 4f243cc02166e1330fe5769683d2a70aca23ded1
        run: |
          git fetch --no-tags --depth=1 origin "${PREVIOUS_REVISION}"
          candidate="$(docker image inspect "${BUILT_IMAGE}" --format '{{.Id}}')"
          yarn run test:e2e:rollback "${PREVIOUS_IMAGE}" "${PREVIOUS_REVISION}" "${candidate}" "$(git rev-parse HEAD)"

      - name: Analyze Image
        uses: ./.github/actions/analyze-image
        with:
          image: ${{ env.BUILT_IMAGE }}

      - name: Push Image to ghcr.io (push to main)
        if: ${{ env.CI_PUBLISH_LATEST == 'true' }}
        run: |
          docker push "${BUILT_IMAGE}"

      - name: Stage immutable image in ghcr.io (push to tag)
        if: ${{ env.CI_PUBLISH_RELEASE == 'true' }}
        run: node scripts/release-image.ts stage
