# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

env:
  CI_LINT: ${{ github.event_name == 'pull_request' }}
  CI_TEST: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
  CI_PUBLISH_RELEASE: ${{ github.repository == 'radius-project/dashboard' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
  CI_PUBLISH_PLUGIN: ${{ github.repository == 'radius-project/dashboard' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'release' }}
  CI_PUBLISH_EDGE: ${{ github.repository == 'radius-project/dashboard' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      plugin-bundle-artifact-id: ${{ steps.plugin-bundle-upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # GU-25 compares the committed graph records against the base branch
          # to catch baseline edits that are not declared in the expected-change
          # manifest, so the base commit has to be present in the clone.
          fetch-depth: 0

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        if: ${{ env.CI_LINT == 'true' }}
        run: yarn run lint:all

      - name: Format
        if: ${{ env.CI_LINT == 'true' }}
        run: yarn run format:check

      - name: Build TypeScript
        run: yarn run tsc

      - name: Build
        run: yarn workspaces foreach -A run build:all

      - name: Build Storybook
        run: yarn workspace @radapp.io/rad-components run build-storybook

      - name: Install Playwright browser
        run: yarn exec playwright install --with-deps chromium

      - name: Run Tests
        env:
          # Release retries use the frozen source, not a later origin/main.
          GRAPH_RECORD_BASE_REF: ${{ github.event_name == 'release' && github.sha || github.event.pull_request.base.sha }}
        # main builds provide the baseline for Codecov pull request comparisons.
        run: yarn run test:all --coverageDirectory=coverage --coverageReporters=lcov --coverageReporters=text

      - name: Upload coverage to Codecov
        if: ${{ github.repository == 'radius-project/dashboard' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          cleanup: true
          disable_search: true
          fail_ci_if_error: true

      - name: Qualify Built Standalone Host
        if: ${{ env.CI_TEST == 'true' }}
        env:
          NODE_ENV: production
        run: yarn run test:e2e:standalone

      - name: Run Component Browser Tests
        if: ${{ env.CI_TEST == 'true' }}
        run: yarn run test:e2e:components

      - name: Qualify Package Artifacts
        if: ${{ env.CI_TEST == 'true' }}
        run: yarn run test:package

      - name: Qualify Plugin Install Bundle
        if: ${{ env.CI_TEST == 'true' || env.CI_PUBLISH_PLUGIN == 'true' }}
        env:
          QUALIFICATION_EVIDENCE_DIRECTORY: ${{ runner.temp }}/radius-plugin-bundle-evidence
        run: yarn run test:e2e:installed

      - name: Prepare Plugin Release Assets
        if: ${{ env.CI_PUBLISH_PLUGIN == 'true' }}
        env:
          BUNDLE_EVIDENCE: ${{ runner.temp }}/radius-plugin-bundle-evidence
          BUNDLE_ASSETS: ${{ runner.temp }}/radius-plugin-release-assets
        run: |
          records=("${BUNDLE_EVIDENCE}"/installed-host-*/qualification.json)
          test "${#records[@]}" -eq 1
          record="${records[0]%/*}"
          archive="radius-backstage-plugin-${GITHUB_REF_NAME}.tar.gz"
          mkdir -p "${BUNDLE_ASSETS}"
          jq -e --arg revision "${GITHUB_SHA}" '
            def digest: type == "string" and test("^[a-f0-9]{64}$");
            def identity: type == "string" and length > 0;
            select(.stage == "installed-external-frontend" and
              .bundle.source.revision == $revision and .bundle.source.dirty == false and
              (.bundle.manifestSha256 | digest) and (.installedLockSha256 | digest) and
              (.node | identity) and (.packageManager | identity) and (.compiler | identity) and
              (.entries == ["@internal/plugin-radius", "@internal/plugin-radius/alpha"]) and
              (all(.bundle.packages["@internal/plugin-radius", "@radius-project/core", "@radius-project/graph-react"];
                (.version | identity) and (.path | identity) and (.sha256 | digest)))) |
            {stage, bundle, entries, node, packageManager, compiler, installedLockSha256}
          ' "${record}/qualification.json" > "${BUNDLE_ASSETS}/radius-backstage-plugin-${GITHUB_REF_NAME}.qualification.json"
          cp "${record}/bundle-build.tar.gz" "${BUNDLE_ASSETS}/${archive}"
          read -r digest _ < "${record}/bundle-build.tar.gz.sha256"
          cd "${BUNDLE_ASSETS}" || exit 1
          printf '%s  %s\n' "${digest}" "${archive}" > "${archive}.sha256"
          sha256sum -c "${archive}.sha256"

      - name: Retain Qualified Plugin Release Assets
        id: plugin-bundle-upload
        if: ${{ env.CI_PUBLISH_PLUGIN == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radius-plugin-release-assets
          path: ${{ runner.temp }}/radius-plugin-release-assets/
          if-no-files-found: error
          retention-days: 7

  build-and-publish-container:
    name: Build and Publish Container
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: dashboard-container-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref || github.run_id }}
      cancel-in-progress: false
    env:
      BUILT_IMAGE: ghcr.io/radius-project/dashboard:edge
    permissions:
      contents: read
      packages: write
    outputs:
      release-digest: ${{ steps.release-digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build TypeScript
        run: yarn run tsc

      - name: Build Backend
        run: yarn run build:backend

      - name: Login to ghcr.io
        if: ${{ env.CI_PUBLISH_EDGE == 'true' || env.CI_PUBLISH_RELEASE == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: yarn run build-image

      - name: Install Playwright browser
        run: yarn exec playwright install chromium

      - name: Start built container
        run: docker run -d --rm --name dashboard-e2e -p 7007:7007 "${BUILT_IMAGE}"

      - name: Wait for container to become ready
        run: |
          # Wait up to 60 seconds for the app to start (30 attempts x 2 seconds).
          for _ in {1..30}; do
            if curl -fsS http://localhost:7007 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs dashboard-e2e
          exit 1

      - name: Run E2E Tests Against Built Container
        run: PLAYWRIGHT_URL=http://localhost:7007 PLAYWRIGHT_DISABLE_WEBSERVER=true yarn run test:e2e

      - name: Stop test container
        if: ${{ always() }}
        run: docker stop dashboard-e2e || true

      # TODO(#421): remove this gate and pinned image after the first native release restore run.
      - name: Qualify image rollback
        continue-on-error: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          PREVIOUS_IMAGE: ghcr.io/radius-project/dashboard@sha256:166dcc84f8399b6c7b2e060c22eda390763d9379001e24695a961154679daa44
          PREVIOUS_REVISION: 4f243cc02166e1330fe5769683d2a70aca23ded1
        run: |
          git fetch --no-tags --depth=1 origin "${PREVIOUS_REVISION}"
          candidate="$(docker image inspect "${BUILT_IMAGE}" --format '{{.Id}}')"
          yarn run test:e2e:rollback "${PREVIOUS_IMAGE}" "${PREVIOUS_REVISION}" "${candidate}" "$(git rev-parse HEAD)"

      - name: Analyze Image
        uses: ./.github/actions/analyze-image
        with:
          image: ${{ env.BUILT_IMAGE }}

      - name: Push Image to ghcr.io (push to main)
        if: ${{ env.CI_PUBLISH_EDGE == 'true' }}
        run: |
          docker push "${BUILT_IMAGE}"

      - name: Stage immutable image in ghcr.io (push to tag)
        if: ${{ env.CI_PUBLISH_RELEASE == 'true' }}
        run: node scripts/release-image.ts stage

      - name: Resolve staged image digest
        id: release-digest
        if: ${{ env.CI_PUBLISH_RELEASE == 'true' }}
        run: |
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/radius-project/dashboard:${REL_VERSION}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  # Signing runs in its own job, so no build or test dependency can request the
  # OIDC token used to sign the release image provenance.
  attest-release-image:
    name: Attest Release Image
    needs: build-and-publish-container
    if: ${{ github.repository == 'radius-project/dashboard' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # Required to sign the provenance with Sigstore
      attestations: write # Required to store the provenance attestation
    steps:
      - name: Attest release image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/radius-project/dashboard
          subject-digest: ${{ needs.build-and-publish-container.outputs.release-digest }}

  publish-plugin-bundle:
    name: Publish Plugin Install Bundle
    needs: build
    if: ${{ github.repository == 'radius-project/dashboard' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: dashboard-plugin-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download Qualified Plugin Release Assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.plugin-bundle-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/radius-plugin-release-assets

      - name: Attach Bundle to Dashboard Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE_ASSETS: ${{ runner.temp }}/radius-plugin-release-assets
        run: |
          cd "${BUNDLE_ASSETS}" || exit 1
          sha256sum -c "radius-backstage-plugin-${GITHUB_REF_NAME}.tar.gz.sha256"
          gh release upload "${GITHUB_REF_NAME}" \
            "radius-backstage-plugin-${GITHUB_REF_NAME}.tar.gz" \
            "radius-backstage-plugin-${GITHUB_REF_NAME}.tar.gz.sha256" \
            "radius-backstage-plugin-${GITHUB_REF_NAME}.qualification.json"
